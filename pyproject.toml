[project]
name = "next-cvat"
version = "0.0.0"
description = "Minimalistic python SDK for CVAT"
authors = [{ name = "nextml" }]
requires-python = ">=3.9,<4"
readme = "README.md"
dependencies = [
    "cvat-sdk>=2.43.0,<3",
    "Pillow",
    "numpy>=1.19.2,<2",
    "pydantic>=2.0.0,<3",
    "typer",
    "pydantic-settings>=2.6.1,<3",
    "eval-type-backport ; python_full_version < '3.10'",
]

[project.scripts]
next-cvat = "next_cvat.__main__:main"
cvat = "next_cvat.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0,<8",
    "pytest-codeblocks>=0.17.0,<0.18",
    "black>=24.0.0,<25",
    "mkdocs-material>=9.5.3,<10",
    "mkdocstrings[python]>=0.24.0,<0.25",
    "griffe>=0.38.1,<0.39",
    "pylint>=2.6.0,<3",
    "flake8>=3.8.4,<4",
    "autoflake>=1.6.1,<2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"
